# English business words as they are commonly written in Devanagari on Hindi-language
# invoices and signboards. The first spelling is the most common; the generator may pick
# any. Indian proper names (Sharma, Gupta, ...) are NOT listed: they go through the
# heuristic Latin -> ITRANS -> Devanagari path in ekam.synth.noise.translit.
PRIVATE: [प्राइवेट, प्रायवेट, प्राईवेट]
LIMITED: [लिमिटेड, लिमिटिड, लि.]
