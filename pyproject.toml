[project]
name = "ekam"
version = "0.1.0"
description = "Entity resolution for messy Indian business records: blocking, matching, consistent clustering and golden records."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
# Milestone 1 dependencies. Heavier ML deps (torch, faiss-cpu, sentence-transformers,
# splink, lightgbm, fastapi, streamlit) are added in the milestone that first needs them,
# so that `uv.lock` stays the single pinned source of truth.
dependencies = [
    "polars>=1.30",
    "duckdb>=1.3",
    "pyarrow>=20",
    "numpy>=2.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3",
    "mlflow>=3.0",
    "indic-transliteration>=2.3.60",
    "rapidfuzz>=3.13",
    "jellyfish>=1.2",
    "httpx>=0.28",
    "tqdm>=4.67",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "hypothesis>=6.135",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ekam"]

[tool.uv]
# Keep wheel cache off C: (only ~8 GB free there).
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that touch real downloaded data (skipped if data is absent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
