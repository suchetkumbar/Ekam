# Public entity-matching benchmarks. All are research datasets with no explicit
# redistribution licence on their download pages -> kept LOCAL ONLY (data/ is gitignored),
# never bundled in the demo, always cited. See docs/DATA.md.
raw_dir: ${paths.raw}/benchmarks
out_dir: ${paths.benchmarks}
datasets:
  abt_buy:
    url: https://pages.cs.wisc.edu/~anhai/data1/deepmatcher_data/Textual/Abt-Buy/abt_buy_exp_data.zip
    family: deepmatcher
  amazon_google:
    url: https://pages.cs.wisc.edu/~anhai/data1/deepmatcher_data/Structured/Amazon-Google/amazon_google_exp_data.zip
    family: deepmatcher
  dblp_acm:
    url: https://pages.cs.wisc.edu/~anhai/data1/deepmatcher_data/Structured/DBLP-ACM/dblp_acm_exp_data.zip
    family: deepmatcher
  walmart_amazon:
    url: https://pages.cs.wisc.edu/~anhai/data1/deepmatcher_data/Structured/Walmart-Amazon/walmart_amazon_exp_data.zip
    family: deepmatcher
  company:
    # Closest public analogue to our task: company-name/text matching (DeepMatcher "Company").
    url: https://pages.cs.wisc.edu/~anhai/data1/deepmatcher_data/Textual/Company/company_exp_data.zip
    family: deepmatcher
  wdc_products_80pair:
    # WDC Products (Peeters, Der & Bizer 2023): 80% corner-case pairs, the hardest setting.
    url: https://data.dws.informatik.uni-mannheim.de/largescaleproductcorpus/data/wdc-products/80pair.zip
    family: wdc_products
    # Standard setting: large train/valid, test on seen entities. The 50%/100% unseen-entity
    # gold standards are kept as extra test sets (generalisation to new entities).
    files:
      train: wdcproducts80cc20rnd000un_train_large.json.gz
      valid: wdcproducts80cc20rnd000un_valid_large.json.gz
      test: wdcproducts80cc20rnd000un_gs.json.gz
      test_unseen50: wdcproducts80cc20rnd050un_gs.json.gz
      test_unseen100: wdcproducts80cc20rnd100un_gs.json.gz
