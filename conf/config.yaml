# Ekam root config. Every path, threshold and hyperparameter lives under conf/.
# Override from the command line, e.g.:  make data ARGS="synth.n_entities=20000 noise=hard"
defaults:
  - paths: default
  - data: mca
  - benchmarks: default
  - synth: default
  - noise: medium
  - split: entity
  - hardware: laptop
  - blocking: default
  - encoder: e5_small
  - matcher: default
  - ce: default
  - al: default
  - _self_

seed: 13

mlflow:
  tracking_uri: sqlite:///mlruns/mlflow.db
  artifact_location: mlruns/artifacts
  experiment: ekam-m1-data

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.cache}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null

pipeline:
  data_steps: [download, benchmarks, ingest, synth, split, audit]
  levels: [easy, medium, hard]
  force: false        # re-run ingest even if its output exists
  m3_stages: [main, ablations, al]
